<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Agent (Murf TTS)</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial; padding:12px; }
  .msg { margin:8px 0; }
  .msg.user { text-align:right; }
  .msg.assistant { text-align:left; }
  .bubble { display:inline-block; padding:8px 12px; border-radius:12px; max-width:70%; }
  .msg.user .bubble { background:#0078ff; color:white; }
  .msg.assistant .bubble { background:#f0f0f0; color:#111; }
  #controls { margin-top:12px; }
  .status-dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:gray; margin-right:6px; }
  .status-dot.recording { background:red; }
</style>
</head>
<body>
<h1>🎙️ Conversational Voice Agent</h1>

<div id="status">
  <span id="agentStatus" class="status-dot idle"></span>
  <span id="statusText">Idle</span>
</div>

<div id="conversation" style="height:300px; overflow:auto; border:1px solid #eee; padding:8px;"></div>

<div id="controls">
  <button id="recordBtn">🎤 Start Recording</button>
  <label id="micLabel">Start Recording</label>
  <audio id="player" controls autoplay style="width:100%; margin-top:8px"></audio>
</div>

<script>
let mediaStream, ws, audioCtx;

function addMessage(text, sender) {
  const convo = document.getElementById("conversation");
  const div = document.createElement("div");
  div.className = `msg ${sender}`;
  div.innerHTML = `<div class="bubble">${text}</div>`;
  convo.appendChild(div);
  convo.scrollTop = convo.scrollHeight;
}

async function playAudioBase64(b64) {
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);
  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audioCtx.destination);
  source.start();
}

recordBtn.onclick = async () => {
  if (recordBtn.classList.contains("recording")) {
    stopRecording();
    return;
  }

  ws = new WebSocket(`ws://${location.host}/ws/stream`);
  ws.binaryType = "arraybuffer";

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const source = audioCtx.createMediaStreamSource(mediaStream);
  const processor = audioCtx.createScriptProcessor(4096, 1, 1);
  source.connect(processor);
  processor.connect(audioCtx.destination);

  processor.onaudioprocess = e => {
    if (ws.readyState !== WebSocket.OPEN) return;
    const input = e.inputBuffer.getChannelData(0);
    const pcm16 = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++) {
      pcm16[i] = Math.max(-1, Math.min(1, input[i])) < 0
        ? input[i] * 0x8000
        : input[i] * 0x7fff;
    }
    ws.send(pcm16.buffer);
  };

  ws.onopen = () => {
    agentStatus.className = "status-dot recording";
    statusText.textContent = "Recording...";
  };

  ws.onclose = () => {
    agentStatus.className = "status-dot idle";
    statusText.textContent = "Idle";
  };

  ws.onmessage = async (event) => {
    const msg = event.data;
    if (msg.startsWith("LLM:")) {
      addMessage(msg.replace("LLM:", ""), "assistant");
    } else if (msg.startsWith("AUDIO:")) {
      try { await playAudioBase64(msg.replace("AUDIO:", "")); }
      catch (err) { console.error("Audio playback error:", err); }
    } else if (msg.startsWith("USER:")) {
      addMessage(msg.replace("USER:", ""), "user");
    }
  };

  recordBtn.disabled = true;
  micLabel.textContent = "Stop Recording";
  recordBtn.classList.add("recording");
};

function stopRecording() {
  if (mediaStream) {
    mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = null;
  }
  ws?.close();
  recordBtn.disabled = false;
  micLabel.textContent = "Start Recording";
  recordBtn.classList.remove("recording");
}
</script>
</body>
</html>
