<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voice Agent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🎙️ Jarvis: Voice Agent</h1>
      <div class="session-pill">
        <span id="sessionIdLabel">Session: —</span>
      </div>
    </header>

    <main class="content">
      <div class="card">
        <div class="status-row">
          <div id="agentStatus" class="status-dot idle"></div>
          <span id="statusText">Idle</span>
          <select id="personaSelect">
            <option value="teacher">Supportive Teacher</option>
            <option value="pirate">Pirate</option>
            <option value="cowboy">Cowboy</option>
            <option value="robot">Robot</option>
            <option value="comedian">Comedian</option>

          </select>

        </div>

        <div class="conversation" id="conversationLog"></div>

        <div class="controls">
          <button id="recordBtn" class="mic-btn" aria-pressed="false">
            <span class="mic-icon">🎤</span>
            <span class="mic-label" id="micLabel">Start Recording</span>
          </button>
        </div>

        <div class="helper">
          <small>Hey Good afternnon ,Vishal</small>
        </div>
      </div>
    </main>
  </div>

  <!-- Hidden audio element for autoplay -->
  <audio id="replyAudio" style="display:none"></audio>

  <script >
   const recordBtn = document.getElementById("recordBtn");
const micLabel = document.getElementById("micLabel");
const agentStatus = document.getElementById("agentStatus");
const statusText = document.getElementById("statusText");
const conversationLog = document.getElementById("conversationLog");

let ws;
let audioCtx;
let audioQueue = [];

// Add message to UI
function addMessage(text, sender="assistant") {
  const msgDiv = document.createElement("div");
  msgDiv.classList.add("msg", sender);

  const bubble = document.createElement("div");
  bubble.classList.add("bubble");
  bubble.textContent = text;

  msgDiv.appendChild(bubble);
  conversationLog.appendChild(msgDiv);
  conversationLog.scrollTop = conversationLog.scrollHeight;
}

// Send persona update when dropdown changes
document.getElementById("personaSelect").addEventListener("change", () => {
  if (ws && ws.readyState === WebSocket.OPEN) {
    const persona = getSelectedPersona();
    console.log("👉 Switching persona mid-session to:", persona);
    ws.send(`PERSONA:${persona}`);
  }
});


// Decode and play Murf audio chunks
function playAudioChunk(b64) {
  return new Promise(async (resolve, reject) => {
    try {
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);

      const source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      const startTime = Math.max(audioQueue.length ? audioQueue[audioQueue.length-1].end : now, now);

      source.onended = () => resolve(); // resolve when audio finished
      source.start(startTime);

      audioQueue.push({ source, end: startTime + audioBuffer.duration });

      resolve(); // resolve immediately when playback starts
    } catch (err) {
      reject(err);
    }
  });
}

// Start/Stop recording
recordBtn.onclick = async () => {
  if (recordBtn.classList.contains("recording")) {
    stopRecording();
    return;
  }

  ws = new WebSocket(`ws://${location.host}/ws/stream`);
  ws.binaryType = "arraybuffer";

  audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const source = audioCtx.createMediaStreamSource(stream);
  const processor = audioCtx.createScriptProcessor(4096, 1, 1);
  source.connect(processor);
  processor.connect(audioCtx.destination);

  processor.onaudioprocess = e => {
    if (ws.readyState !== WebSocket.OPEN) return;
    const input = e.inputBuffer.getChannelData(0);
    const pcm16 = new Int16Array(input.length);
    for (let i = 0; i < input.length; i++)
      pcm16[i] = Math.max(-1, Math.min(1, input[i])) < 0 ? input[i] * 0x8000 : input[i] * 0x7fff;
    ws.send(pcm16.buffer);
  };

  ws.onopen = () => {
  let persona = "teacher"; // default fallback
  try {
    if (typeof getSelectedPersona === "function") {
      persona = getSelectedPersona();
    }
  } catch (e) {
    console.error("Persona select failed, using default:", e);
  }

  console.log("👉 Sending persona to backend:", persona);
  ws.send(`PERSONA:${persona}`);
};


  ws.onclose = () => {
    agentStatus.className = "status-dot idle";
    statusText.textContent = "Idle";
  };

  let pendingAssistantText = null;

ws.onmessage = async (event) => {
  const msg = event.data;

  if (msg.startsWith("LLM:")) {
    // save assistant text until audio is played
    pendingAssistantText = msg.replace("LLM:", "");

  } else if (msg.startsWith("AUDIO:")) {
    const b64 = msg.replace("AUDIO:", "");
    try {
      await playAudioChunk(b64);

      // once audio starts, show the text bubble
      if (pendingAssistantText) {
        addMessage(pendingAssistantText, "assistant");
        pendingAssistantText = null;
      }
    } catch (err) {
      console.error("Audio decode/playback error:", err);
    }

  } else if (msg.startsWith("USER:")) {
    const text = msg.replace("USER:", "");
    addMessage(text, "user");
  }
};


  recordBtn.disabled = true;
  micLabel.textContent = "Stop Recording";
  recordBtn.classList.add("recording");
};

// Stop recording
function stopRecording() {
  const tracks = audioCtx?.createMediaStreamSource?.()?.mediaStream?.getTracks() || [];
  tracks.forEach(t => t.stop());
  ws?.close();
  recordBtn.disabled = false;
  micLabel.textContent = "Start Recording";
  recordBtn.classList.remove("recording");
}

function getSelectedPersona() {
  const select = document.getElementById("personaSelect");
  return select.value;
}

// Example fetch call
async function sendMessage(userMessage) {
  const persona = getSelectedPersona();

  const response = await fetch("/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      message: userMessage,
      persona: persona
    })
  });

  const data = await response.json();
  displayAssistantMessage(data.reply);
}



  </script>
</body>
</html>
